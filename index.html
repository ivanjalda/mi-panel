<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Panel</title>
<style>
:root{--f:#0d0f14;--c:#171a22;--c2:#1f2330;--t:#eef0f5;--s:#9aa1b2;--o:#d9b45a;--v:#3fbf7f;--r:#e0675f;--a:#5b8def}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--f);color:var(--t);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px;min-height:100vh}
header{padding:20px 18px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;letter-spacing:.3px}h1 span{color:var(--o)}
.mini{color:var(--s);font-size:13px}
main{padding:8px 14px;max-width:760px;margin:0 auto}
.tarjeta{background:var(--c);border-radius:16px;padding:16px;margin-bottom:12px}
.tarjeta h2{font-size:15px;color:var(--s);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px}
.grande{font-size:30px;font-weight:700}
.fila{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--c2)}
.fila:last-child{border:0}
.verde{color:var(--v)}.rojo{color:var(--r)}.oro{color:var(--o)}
.barra{height:12px;background:var(--c2);border-radius:8px;overflow:hidden;margin:10px 0 4px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--v));border-radius:8px}
.cuadros{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cuadro{background:var(--c2);border-radius:12px;padding:12px}
.cuadro b{display:block;font-size:20px;margin-top:2px}
.boton{display:block;width:100%;text-align:center;background:var(--o);color:#1b1505;font-weight:700;border:0;border-radius:12px;padding:13px;font-size:16px;text-decoration:none;margin-top:10px;cursor:pointer}
.boton.gris{background:var(--c2);color:var(--t)}
a{color:var(--a)}
.etq{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--c2);color:var(--s);margin-bottom:6px}
.post{white-space:pre-wrap}
.cita{border-left:3px solid var(--o);padding:6px 10px;margin:10px 0;color:#f3e6c2;font-style:italic}
.dias{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.dias div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--s);height:100%}
.dias span{width:100%;border-radius:6px 6px 2px 2px;min-height:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:#11141bf2;backdrop-filter:blur(8px);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--c2)}
nav button{background:none;border:0;color:var(--s);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;cursor:pointer}
nav button i{font-style:normal;font-size:22px}
nav button.activo{color:var(--o)}
#entrar{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
#entrar input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--c2);background:var(--c);color:var(--t);font-size:17px;margin-top:18px}
#entrar label{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--s);font-size:14px;margin-top:12px}
.oculto{display:none!important}
.vacio{color:var(--s);text-align:center;padding:18px 6px}
</style>
</head>
<body>

<section id="entrar">
  <div style="font-size:54px">🔐</div>
  <h1>Mi <span>Panel</span></h1>
  <p class="mini" style="margin-top:6px">Escribe tu contraseña del panel</p>
  <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña">
  <label><input id="recordar" type="checkbox" checked style="width:auto;margin:0"> Recordar en este móvil</label>
  <button class="boton" id="botonEntrar">Entrar</button>
  <p id="error" class="rojo" style="margin-top:12px"></p>
</section>

<div id="app" class="oculto">
  <header>
    <h1>Mi <span>Panel</span></h1>
    <div class="mini" id="actualizado"></div>
  </header>
  <main id="contenido"></main>
  <nav id="menu"></nav>
</div>

<script>
const SECCIONES=[["inicio","🏠","Inicio"],["negocios","📂","Negocios"],["cuentas","💶","Cuentas"],["bienestar","🌿","Bienestar"],["redes","📱","Redes"]];
let D=null, actual="inicio";
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(Number(n)||0).toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function leerLocal(k){try{return localStorage.getItem(k)}catch(e){return null}}
function borrarLocal(k){try{localStorage.removeItem(k)}catch(e){}}

async function descifrar(clave){
  const r=await fetch("datos.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("sin datos");
  const p=await r.json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(p.sal),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plano=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(p.iv)},k,b64(p.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}

async function entrar(clave,recordar){
  $("#error").textContent="Abriendo…";
  try{
    D=await descifrar(clave);
    if(recordar) guardar("panel_clave",clave);
    $("#entrar").classList.add("oculto");$("#app").classList.remove("oculto");
    pintarMenu();pintar();
  }catch(e){
    $("#error").textContent=e.message==="sin datos"?"El motor aún está preparando tus datos. Vuelve en 10 minutos.":"Contraseña incorrecta. Prueba otra vez.";
    borrarLocal("panel_clave");
  }
}

function pintarMenu(){
  $("#menu").innerHTML=SECCIONES.map(([id,ic,nom])=>`<button data-s="${id}" class="${id===actual?"activo":""}"><i>${ic}</i>${nom}</button>`).join("");
  $("#menu").querySelectorAll("button").forEach(b=>b.onclick=()=>{actual=b.dataset.s;pintarMenu();pintar();scrollTo(0,0)});
}

const telegram=()=>D.bot?`<a class="boton" href="https://t.me/${esc(D.bot)}">Abrir mi motor en Telegram</a>`:"";

function vInicio(){
  const c=D.cuentas||{}, pct=c.objetivo?Math.min(100,Math.round(100*Math.max(c.beneficio,0)/c.objetivo)):0;
  const b=(D.bienestar||[]).slice(-1)[0]||{};
  return `<div class="tarjeta"><h2>Este mes</h2><div class="grande ${c.beneficio>=0?"verde":"rojo"}">${eur(c.beneficio)}</div>
  <div class="mini">beneficio · ingresos ${eur(c.ingresos)} · gastos ${eur(c.gastos)}</div>
  ${c.objetivo?`<div class="barra"><i style="width:${pct}%"></i></div><div class="mini">${pct}% de tu objetivo de ${eur(c.objetivo)}</div>`:""}</div>
  <div class="cuadros">
   <div class="cuadro"><span class="mini">Ideas esperando</span><b class="oro">${(D.pendientes||[]).length}</b></div>
   <div class="cuadro"><span class="mini">Tareas hechas</span><b>${(D.hecho||[]).length}</b></div>
   <div class="cuadro"><span class="mini">Webs activas</span><b>${(D.webs||[]).length}</b></div>
   <div class="cuadro"><span class="mini">Último sueño</span><b>${b.sueno?b.sueno+" h":"—"}</b></div>
  </div>
  <div class="tarjeta" style="margin-top:12px"><h2>Tu propósito</h2><div class="cita">«Todo lo puedo en Cristo que me fortalece.» — Filipenses 4:13 (RV1909)</div>${telegram()}</div>`;
}

function vNegocios(){
  const p=D.pendientes||[], h=D.hecho||[], w=D.webs||[];
  return `<div class="tarjeta"><h2>Ideas esperando tu sí (${p.length})</h2>
  ${p.length?p.map(x=>`<div class="fila" style="display:block"><span class="etq">${x.tipo==="crear_web"?"🆕 Web nueva":"🔧 Mejora"} · ${esc(x.repo)}</span><div>${esc(x.resumen)}</div></div>`).join(""):`<div class="vacio">Todo al día ✨</div>`}
  ${p.length?telegram():""}</div>
  <div class="tarjeta"><h2>Hecho por el motor</h2>
  ${h.length?h.map(x=>`<div class="fila" style="display:block"><span class="etq">${esc((x.fecha||"").replace("T"," "))} · ${esc(x.repo||"")}</span><div>${esc(x.resumen)}</div></div>`).join(""):`<div class="vacio">Aquí verás todo lo que vaya haciendo.</div>`}</div>
  <div class="tarjeta"><h2>Tus webs (${w.length})</h2>
  ${w.map(x=>`<div class="fila"><span>${esc(x.repo)}</span><a href="${esc(x.url)}" target="_blank" rel="noopener">Abrir</a></div>`).join("")}</div>`;
}

function vCuentas(){
  const c=D.cuentas||{}, a=D.apuntes||[], pct=c.objetivo?Math.min(100,Math.round(100*Math.max(c.beneficio,0)/c.objetivo)):0;
  return `<div class="tarjeta"><h2>Mes ${esc(c.mes||"")}</h2>
   <div class="fila"><span>Ingresos</span><b class="verde">${eur(c.ingresos)}</b></div>
   ${c.ingresos_stripe?`<div class="fila"><span class="mini">de ellos por Stripe</span><span>${eur(c.ingresos_stripe)}</span></div>`:""}
   <div class="fila"><span>Gastos</span><b class="rojo">${eur(c.gastos)}</b></div>
   <div class="fila"><span>Beneficio</span><b>${eur(c.beneficio)}</b></div></div>
  <div class="tarjeta"><h2>🎯 Objetivo</h2>
  ${c.objetivo?`<div class="grande oro">${eur(c.objetivo)}</div><div class="barra"><i style="width:${pct}%"></i></div>
   <div class="mini">${pct}% conseguido · faltan ${eur(c.falta)}</div>
   <div class="cuadros" style="margin-top:12px"><div class="cuadro"><span class="mini">Al día necesitas</span><b>${eur(c.por_dia)}</b></div><div class="cuadro"><span class="mini">Días que quedan</span><b>${c.dias_restan}</b></div></div>`
   :`<div class="vacio">Dile al motor en Telegram: /objetivo 3000</div>`}</div>
  <div class="tarjeta"><h2>Movimientos</h2>
  ${a.length?a.map(x=>`<div class="fila"><span>${esc(x.concepto||x.clase)}<br><span class="mini">${esc(x.fecha)}</span></span><b class="${x.clase==="ingreso"?"verde":"rojo"}">${x.clase==="ingreso"?"+":"−"}${eur(x.importe)}</b></div>`).join(""):`<div class="vacio">Apunta en Telegram: /ingreso 120 venta · /gasto 15 dominio</div>`}</div>`;
}

function vBienestar(){
  const b=(D.bienestar||[]).slice(-7);
  if(!b.length) return `<div class="tarjeta"><h2>Bienestar</h2><div class="vacio">Cada mañana el motor te pregunta cuánto has dormido y cada noche tu estrés. Aquí verás tu semana.</div></div>`;
  const s=b.filter(x=>x.sueno).map(x=>x.sueno), e=b.filter(x=>x.estres).map(x=>x.estres);
  const med=l=>l.length?(l.reduce((a,c)=>a+c,0)/l.length).toFixed(1):"—";
  const barras=(campo,max,color)=>`<div class="dias">${b.map(x=>`<div><span style="height:${Math.round(100*(x[campo]||0)/max)}%;background:${color}"></span>${esc(x.fecha.slice(8))}</div>`).join("")}</div>`;
  return `<div class="cuadros"><div class="cuadro"><span class="mini">Sueño medio</span><b>${med(s)} h</b></div><div class="cuadro"><span class="mini">Estrés medio</span><b>${med(e)} / 5</b></div></div>
  <div class="tarjeta" style="margin-top:12px"><h2>😴 Horas de sueño</h2>${barras("sueno",9,"var(--a)")}</div>
  <div class="tarjeta"><h2>🧘 Estrés</h2>${barras("estres",5,"var(--o)")}</div>
  <div class="tarjeta"><div class="cita">«Venid á mí todos los que estáis trabajados y cargados, que yo os haré descansar.» — Mateo 11:28 (RV1909)</div></div>`;
}

function vRedes(){
  const r=D.redes||[];
  return `<div class="tarjeta"><h2>Publicaciones listas (${r.length})</h2><p class="mini">Cada mañana el motor te prepara una. Las que guardas aparecen aquí para copiar y subir.</p>${telegram()}</div>
  ${r.map((x,i)=>`<div class="tarjeta"><span class="etq">${esc(x.fecha||"")}</span><div class="post">${esc(x.texto)}</div>
   <div class="cita">«${esc(x.versiculo)}» — ${esc(x.cita)} (RV1909)</div>
   <div class="mini">${esc((x.hashtags||[]).join(" "))}</div>
   <div class="mini" style="margin-top:8px">📸 ${esc(x.idea_foto||"")}</div>
   <button class="boton gris" data-copiar="${i}">Copiar texto</button></div>`).join("")}`;
}

function pintar(){
  $("#actualizado").textContent=D.actualizado?"Actualizado "+D.actualizado:"";
  $("#contenido").innerHTML={inicio:vInicio,negocios:vNegocios,cuentas:vCuentas,bienestar:vBienestar,redes:vRedes}[actual]();
  document.querySelectorAll("[data-copiar]").forEach(b=>b.onclick=async()=>{
    const x=D.redes[+b.dataset.copiar];
    const t=`${x.texto}\n\n«${x.versiculo}» — ${x.cita}\n\n${(x.hashtags||[]).join(" ")}`;
    try{await navigator.clipboard.writeText(t);b.textContent="¡Copiado! ✅"}catch(e){b.textContent="Mantén pulsado el texto para copiarlo"}
  });
}

$("#botonEntrar").onclick=()=>entrar($("#clave").value,$("#recordar").checked);
$("#clave").addEventListener("keydown",e=>{if(e.key==="Enter")$("#botonEntrar").click()});
const guardada=leerLocal("panel_clave"); if(guardada) entrar(guardada,true);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
